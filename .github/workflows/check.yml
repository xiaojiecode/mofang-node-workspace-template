name: Template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Keep the runner OS within the pinned Playwright version's supported platforms.
    runs-on: ubuntu-24.04
    env:
      MF_CACHE_DIR: ${{ github.workspace }}/.cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build:dev && npm run test:browser
